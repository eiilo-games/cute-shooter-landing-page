<!doctype html>
<!-- Source of img/og.png, the 1200x630 share card. Rendered with headless

<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Share card: Cute Shooter</title><link rel="stylesheet" href="/style.css"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:linear-gradient(#5cadf5,#c7ebff)}
.card{position:relative;width:1200px;height:630px}
.cl{position:absolute;opacity:.9}
.txt{position:absolute;left:70px;top:70px;width:540px}
.txt .icon{width:110px;height:110px;border-radius:28px;box-shadow:0 0 0 4px #29334f}
h1{font-family:var(--display);font-size:72px;line-height:.95;color:#fff;text-shadow:var(--outline),0 9px 0 rgba(41,51,79,.35);margin:28px 0 18px}
p{font-family:var(--display);font-size:28px;line-height:1.2;color:#fff3b0;text-shadow:var(--outline-thin);margin:0}
.f{font-family:var(--future);font-size:20px;color:#29334f;margin-top:26px;white-space:nowrap;text-shadow:none}
.shot{position:absolute;width:250px;height:444px;border-radius:26px;border:6px solid #29334f;box-shadow:0 10px 0 rgba(41,51,79,.3);object-fit:cover}
</style></head><body><div class="card">
<img class="cl" src="/img/bg/cloud1.png" style="left:-40px;top:470px;width:300px" alt="">
<img class="cl" src="/img/bg/cloud4.png" style="left:520px;top:20px;width:180px" alt="">
<img class="cl" src="/img/bg/cloud6.png" style="left:380px;top:520px;width:260px" alt="">
<div class="txt"><img class="icon" src="/img/icon-256.png" alt=""><h1>Cute<br>Shooter</h1><p>Pick the right gate. Pop everything cute.</p><p class="f">Free on Android &middot; cute-shooter.com</p></div>
<img class="shot" src="/img/shots/menu.webp" style="left:660px;top:120px;transform:rotate(-6deg)" alt="">
<img class="shot" src="/img/shots/run_90.webp" style="left:900px;top:110px;transform:rotate(5deg)" alt="">
<img class="shot" src="/img/shots/run_20.webp" style="left:780px;top:80px;transform:rotate(0deg);z-index:2" alt="">
</div></body></html>
